name: GameMetrik
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: '17.0'
packages:
  GameMetrikNative:
    path: ../NativeApp
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_LANGUAGE: fr
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GameMetrik:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: GameMetrikNative
        product: GameMetrikCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.gamemetrik.ios
        PRODUCT_NAME: GameMetrik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GameMetrik
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        CFBundleDevelopmentRegion: fr
        NSFaceIDUsageDescription: Déverrouiller tes connexions privées et les données de ton studio.
        NSCameraUsageDescription: Scanner le QR code de transfert affiché par GameMetrik sur ton Mac.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: ch.gamemetrik.connection
            UTTypeDescription: Connexion GameMetrik chiffrée
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: gmconnection
  GameMetrikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GameMetrik
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.gamemetrik.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  GameMetrikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GameMetrik
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.gamemetrik.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GameMetrik:
    build:
      targets:
        GameMetrik: all
    test:
      targets: [GameMetrikTests, GameMetrikUITests]
